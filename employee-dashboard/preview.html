<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Dashboard - Live Demo</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- React, ReactDOM, Babel, React Router CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@remix-run/router@1.19.0/dist/router.umd.js" crossorigin></script>
  <script src="https://unpkg.com/react-router@6.26.2/dist/umd/react-router.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-router-dom@6.26.2/dist/umd/react-router-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .navbar-nav .nav-link.active {
      font-weight: bold;
      color: #fff !important;
    }
    .table th, .table td {
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { HashRouter, Routes, Route, Link, NavLink, Navigate } = ReactRouterDOM;

    // --- Navbar Component ---
    function Navbar() {
      return (
        <nav className="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
          <div className="container">
            <Link className="navbar-brand fw-bold" to="/">
              Employee Dashboard
            </Link>
            <div className="navbar-nav ms-auto flex-row gap-3">
              <NavLink className="nav-link" to="/">
                Home
              </NavLink>
              <NavLink className="nav-link" to="/employee-form">
                Employee Form
              </NavLink>
            </div>
          </div>
        </nav>
      );
    }

    // --- Dashboard Component ---
    function Dashboard() {
      const [employees, setEmployees] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        fetch('https://jsonplaceholder.typicode.com/users')
          .then((res) => {
            if (!res.ok) throw new Error('Failed to fetch data');
            return res.json();
          })
          .then((data) => {
            setEmployees(data);
            setLoading(false);
          })
          .catch((err) => {
            setError(err.message);
            setLoading(false);
          });
      }, []);

      return (
        <div className="mt-4">
          <h2 className="mb-4 text-center">Employee List</h2>

          {loading && (
            <div className="text-center my-5">
              <div className="spinner-border text-primary" role="status">
                <span className="visually-hidden">Loading...</span>
              </div>
              <p className="mt-2 text-muted">Loading employee records from API...</p>
            </div>
          )}

          {error && (
            <div className="alert alert-danger" role="alert">
              {error}
            </div>
          )}

          {!loading && !error && (
            <div className="table-responsive shadow-sm rounded">
              <table className="table table-striped table-hover table-bordered mb-0">
                <thead className="table-dark">
                  <tr>
                    <th scope="col" style={{ width: '80px' }}>ID</th>
                    <th scope="col">Name</th>
                    <th scope="col">Email</th>
                  </tr>
                </thead>
                <tbody>
                  {employees.map((emp) => (
                    <tr key={emp.id}>
                      <td>{emp.id}</td>
                      <td>{emp.name}</td>
                      <td>{emp.email}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // --- EmployeeForm Component ---
    function EmployeeForm() {
      const [formData, setFormData] = useState({
        name: '',
        designation: '',
        location: '',
        salary: ''
      });
      const [message, setMessage] = useState('');

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();

        if (!formData.name || !formData.designation || !formData.location || !formData.salary) {
          alert('Please fill out all fields.');
          return;
        }

        if (Number(formData.salary) <= 0) {
          alert('Salary must be a positive number.');
          return;
        }

        setMessage(`Employee "${formData.name}" added successfully!`);
        setFormData({ name: '', designation: '', location: '', salary: '' });
      };

      return (
        <div className="row justify-content-center mt-4">
          <div className="col-md-8 col-lg-6">
            <div className="card shadow-sm">
              <div className="card-header bg-primary text-white">
                <h4 className="mb-0 text-center">Employee Form</h4>
              </div>
              <div className="card-body p-4">
                {message && (
                  <div className="alert alert-success alert-dismissible fade show" role="alert">
                    {message}
                  </div>
                )}

                <form onSubmit={handleSubmit}>
                  <div className="mb-3">
                    <label className="form-label fw-semibold">Name</label>
                    <input
                      type="text"
                      className="form-control"
                      name="name"
                      placeholder="Enter employee name"
                      value={formData.name}
                      onChange={handleChange}
                      required
                    />
                  </div>

                  <div className="mb-3">
                    <label className="form-label fw-semibold">Designation</label>
                    <input
                      type="text"
                      className="form-control"
                      name="designation"
                      placeholder="e.g. Developer, Designer, Manager"
                      value={formData.designation}
                      onChange={handleChange}
                      required
                    />
                  </div>

                  <div className="mb-3">
                    <label className="form-label fw-semibold">Location</label>
                    <input
                      type="text"
                      className="form-control"
                      name="location"
                      placeholder="e.g. Bangalore, Kochi, Remote"
                      value={formData.location}
                      onChange={handleChange}
                      required
                    />
                  </div>

                  <div className="mb-3">
                    <label className="form-label fw-semibold">Salary</label>
                    <input
                      type="number"
                      className="form-control"
                      name="salary"
                      placeholder="Enter salary"
                      value={formData.salary}
                      onChange={handleChange}
                      min="1"
                      required
                    />
                  </div>

                  <button type="submit" className="btn btn-primary w-100 py-2">
                    Submit
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Main App Component ---
    function App() {
      return (
        <HashRouter>
          <Navbar />
          <div className="container pb-5">
            <Routes>
              <Route path="/" element={<Dashboard />} />
              <Route path="/dashboard" element={<Dashboard />} />
              <Route path="/employee-form" element={<EmployeeForm />} />
              <Route path="*" element={<Navigate to="/" replace />} />
            </Routes>
          </div>
        </HashRouter>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
